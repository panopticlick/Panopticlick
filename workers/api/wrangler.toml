# Top-level config is the DEV worker. Production lives in [env.production].
# The two names MUST differ: a bare `wrangler deploy` used to overwrite the
# production worker because both were named "panopticlick-api" (see commit
# 02b5a01 fallout). Deploy production with `wrangler deploy --env production`.
name = "panopticlick-api-dev"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# account_id is intentionally NOT in this file. Pass CLOUDFLARE_ACCOUNT_ID in the
# environment so a stray global token from another account cannot silently
# resolve to the wrong account.

# Development settings
[dev]
port = 8787

[[d1_databases]]
binding = "DB"
database_name = "panopticlick"
database_id = "a289c2aa-912e-44d6-bc05-8fcb40fe3e09"

[[kv_namespaces]]
binding = "CACHE"
id = "50cbb86886a5498eace6b518fe573634"

# Analytics Engine must be enabled once per account in the dashboard
# (Workers → Analytics Engine) before this binding can be deployed.
# Until then the binding is absent and every call site degrades via `?.`.
# [[analytics_engine_datasets]]
# binding = "ANALYTICS"
# dataset = "panopticlick_events"

# Environment variables
[vars]
ENVIRONMENT = "development"
API_VERSION = "v1"
# Comma-separated list of allowed origins for CORS
ALLOWED_ORIGINS = "http://localhost:3000,https://panopticlick.org"
# Optional Turnstile secret (set in production)
TURNSTILE_SECRET = ""

# AI Chat Configuration (OpenRouter)
# NOTE: DO NOT commit API keys to git!
# Set OPENROUTER_API_KEY as a secret using:
#   npx wrangler secret put OPENROUTER_API_KEY --env production
# Or for local dev, create .dev.vars file with:
#   OPENROUTER_API_KEY=sk-or-v1-your-key-here
OPENROUTER_MODEL = "meta-llama/llama-3.3-70b-instruct:free"

# IPBot IP intelligence API
# The API key is a secret — NEVER put it here. Set it with:
#   npx wrangler secret put IPBOT_API_KEY --env production
# For local dev, add IPBOT_API_ORIGIN + IPBOT_API_KEY to .dev.vars
IPBOT_API_ORIGIN = "https://api.ipbot.com"

# ---------------------------------------------------------------------------
# Production environment
# Bindings are NOT inherited from the top level — every binding must be
# repeated here or it will be missing at runtime.
# ---------------------------------------------------------------------------
[env.production]
name = "panopticlick-api"
# Custom domains take a bare hostname — no wildcard, no path. The old
# "api.panopticlick.org/*" pattern made `deploy --env production` fail outright,
# which is part of why production was only ever deployed from the top-level config.
routes = [
  { pattern = "api.panopticlick.org", custom_domain = true }
]

[env.production.vars]
ENVIRONMENT = "production"
API_VERSION = "v1"
IPBOT_API_ORIGIN = "https://api.ipbot.com"
OPENROUTER_MODEL = "meta-llama/llama-3.3-70b-instruct:free"
# Production CORS allowlist. Without this the middleware falls back to a
# default list that includes localhost with Allow-Credentials.
ALLOWED_ORIGINS = "https://panopticlick.org,https://www.panopticlick.org"
# Turnstile is deliberately unconfigured: the frontend has no widget yet, so a
# real secret here would fail-closed and break every scan. Declared explicitly
# so the empty value is a decision rather than an omission.
TURNSTILE_SECRET = ""

[[env.production.d1_databases]]
binding = "DB"
database_name = "panopticlick"
database_id = "a289c2aa-912e-44d6-bc05-8fcb40fe3e09"

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "50cbb86886a5498eace6b518fe573634"

# See the note on the top-level binding: enable Analytics Engine in the
# dashboard first, then uncomment both blocks together.
# [[env.production.analytics_engine_datasets]]
# binding = "ANALYTICS"
# dataset = "panopticlick_events"

# Rate limiting. namespace_id is an arbitrary integer scoped to this worker —
# no dashboard resource to create. Available on the free plan.
[[env.production.unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

[[env.production.unsafe.bindings]]
name = "AI_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# Cron trigger for data retention (sessions 30d, fingerprints 90d,
# hsts_cookies 7d), matching the `scheduled` handler in src/index.ts.
# Production only: the dev worker shares the same D1 database, so a second
# trigger would just duplicate the same deletes.
[env.production.triggers]
crons = ["0 3 * * *"]
